name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # the modules pin JDK 25 through maven-toolchains-plugin (vendor "openjdk"), so the JDK
      # is also registered in ~/.m2/toolchains.xml under that vendor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          mvn-toolchain-vendor: openjdk

      # the assess tests score the java-ref sample project with an offline 'mvn -o test', so its
      # plugins and dependencies have to be in the local repository before they run
      - name: Prime Maven for the assess sample project
        run: mvn -B -ntp -q -Dmaven.test.failure.ignore=true -f modules/assess/naru-assess-impl/src/main/resources/net/thevpc/naru/ext/assess/java-ref/project/pom.xml test

      # the desktop module's tests build Swing components, which need a display; tests that
      # call a real model are opt-in (-Dnaru.test.model / -Dnaru.assess.model) and stay off
      - name: Build and test
        run: xvfb-run --auto-servernum mvn -B -ntp install

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
