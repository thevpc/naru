name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # the modules pin JDK 25 through maven-toolchains-plugin (vendor "openjdk"), so the JDK
      # is also registered in ~/.m2/toolchains.xml under that vendor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          mvn-toolchain-vendor: openjdk

      # the assess tests score the java-ref sample project with an offline 'mvn -o test', so its
      # plugins and dependencies have to be in the local repository before they run. Built from a
      # copy: a target/ folder inside src/main/resources would become part of the asset
      - name: Prime Maven for the assess sample project
        run: |
          cp -r modules/assess/naru-assess-impl/src/main/resources/net/thevpc/naru/ext/assess/java-ref/project "$RUNNER_TEMP/assess-prime"
          mvn -B -ntp -q -Dmaven.test.failure.ignore=true -f "$RUNNER_TEMP/assess-prime/pom.xml" test

      # the desktop typeface tests check that CJK and emoji fall back to a platform font, and
      # the runner image ships neither
      - name: Install CJK and emoji fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji

      # the desktop module's tests build Swing components, which need a display; tests that
      # call a real model are opt-in (-Dnaru.test.model / -Dnaru.assess.model) and stay off
      - name: Build and test
        run: xvfb-run --auto-servernum mvn -B -ntp install

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
